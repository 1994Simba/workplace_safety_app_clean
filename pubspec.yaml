name: workplace_safety_app_clean
description: A Flutter app for workplace safety inspections and hazard reporting.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Plugins used in your app
  image_picker: ^1.1.1
  speech_to_text: ^6.6.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2

  # Hive local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation tools (must be in dev_dependencies)
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/
